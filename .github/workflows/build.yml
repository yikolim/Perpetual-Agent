name: Build Noesis.app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary (arm64 + x86_64)
        run: |
          ARCH=arm64 ./build.sh
          cp build/Noesis.app/Contents/MacOS/Noesis /tmp/Noesis-arm64
          ARCH=x86_64 ./build.sh
          lipo -create /tmp/Noesis-arm64 \
               build/Noesis.app/Contents/MacOS/Noesis \
               -output build/Noesis.app/Contents/MacOS/Noesis
          codesign --force --deep --sign - build/Noesis.app
          lipo -info build/Noesis.app/Contents/MacOS/Noesis

      - name: Zip the app
        run: ditto -c -k --keepParent build/Noesis.app Noesis.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noesis.app
          path: Noesis.zip

      - name: Publish rolling "latest" release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Noesis (latest build)
          files: Noesis.zip
          body: |
            **Download `Noesis.zip` below**, unzip it, drag `Noesis.app`
            to your Applications folder, then **right-click → Open → Open**
            the first time (the build is not notarized).

            Look for the moon/bolt icon in your menu bar — there is no Dock icon.

            Universal binary (Apple Silicon + Intel), built automatically from
            the latest commit on `main`.

      - name: Publish release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Noesis.zip
          generate_release_notes: true
          body: |
            **Download `Noesis.zip` below**, unzip it, drag `Noesis.app`
            to your Applications folder, then **right-click → Open → Open**
            the first time (the build is not notarized).

            Look for the moon/bolt icon in your menu bar — there is no Dock icon.
